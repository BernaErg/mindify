[build]
  command = "bash build.sh"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Pretty URLs: /about → /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
[[redirects]]
  from = "/courses"
  to = "/courses.html"
  status = 200
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200
[[redirects]]
  from = "/logos"
  to = "/logos.html"
  status = 200

# Build sources shouldn't be fetchable from the deployed site.
[[redirects]]
  from = "/tools/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/build.sh"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/.env.example"
  to = "/index.html"
  status = 404
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
